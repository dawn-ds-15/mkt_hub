services:
  postgres:
    image: postgres:16-alpine
    container_name: mkthub-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mkthub
      POSTGRES_USER: mkthub
      POSTGRES_PASSWORD: mkthub123
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mkthub-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mkthub.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

  app:
    build: .
    container_name: mkthub-api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://mkthub:mkthub123@postgres:5432/mkthub
      JWT_SECRET: dev-secret-change-in-production
    volumes:
      - ./src:/app/src

volumes:
  pgdata: